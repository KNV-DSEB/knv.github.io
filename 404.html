<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found</title>
<style>
:root{--ground:#EBEFF0;--text:#0A1620;--muted:#5C6B72;--accent:#0E6E77}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ground:#08131C;--text:#DFE9EC;--muted:#7D959E;--accent:#45BAC3}}
:root[data-theme="dark"]{--ground:#08131C;--text:#DFE9EC;--muted:#7D959E;--accent:#45BAC3}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--ground);color:var(--text);
 font-family:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,sans-serif;text-align:center;padding:2rem}
h1{font-family:ui-monospace,Consolas,"SF Mono",monospace;font-size:clamp(1.6rem,5vw,2.4rem);letter-spacing:-.03em;margin:0}
p{color:var(--muted);margin:.9rem 0 1.6rem}
a{color:var(--accent);font-family:ui-monospace,Consolas,monospace;font-size:.85rem;letter-spacing:.08em;
 text-transform:uppercase;text-decoration:none;border-bottom:1px solid currentColor;padding-bottom:2px}
</style>
</head>
<body>
<main>
<h1>No signal on that path.</h1>
<p>That page does not exist here.</p>
<a href="/">Back to the portfolio</a>
</main>
</body>
</html>
